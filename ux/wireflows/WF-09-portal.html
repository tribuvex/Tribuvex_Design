<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WF-09 · Portal contribuyente — Wireflow Tribuvex</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/wireflow-board.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>WF-09 · Portal contribuyente</h1>
      <p>P1 entrada → P2 faltantes/upload → P3 aceptar borrador.</p>
    </div>
    <nav>
      <a href="../SITEMAP.md">Task flow</a>

      <a href="../../mockup/index.html">Hub mockup</a>
      <a class="primary" href="../../mockup/login.html">Entrar</a>
    </nav>
  </header>
  <div class="legend">
    <span><i class="swatch"></i> Camino feliz</span>
    <span><i class="swatch dash"></i> Rama / decisión</span>
    <span><i class="swatch pc"></i> Control</span>
  </div>
  <div class="board-wrap">
    <div class="board" id="board" aria-label="WF-09"></div>
  </div>
  <p class="hint">Miniaturas = mockup real. Si el navegador bloquea iframes locales, verás silueta wire. Spec enlazada arriba.</p>
  <script src="./assets/wireflow-board.js"></script>
  <script>
    TribuvexWireflow.mount({
  "width": 1100,
  "height": 520,
  "mockBase": "../../mockup/",
  "sections": [
    {
      "label": "Portal (sin jerga)",
      "x": 24,
      "y": 18
    }
  ],
  "screens": [
    {
      "id": "p1",
      "num": "1",
      "name": "P1 Inicio",
      "href": "portal/index.html",
      "x": 80,
      "y": 60,
      "hub": true
    },
    {
      "id": "p2",
      "num": "2",
      "name": "P2 Qué falta",
      "href": "portal/upload.html",
      "x": 360,
      "y": 60
    },
    {
      "id": "p3",
      "num": "3",
      "name": "P3 Borrador",
      "href": "portal/borrador.html",
      "x": 640,
      "y": 60
    },
    {
      "id": "firma",
      "num": "4",
      "name": "Vuelve a firma (E3)",
      "href": "expediente.html?etapa=3",
      "x": 360,
      "y": 320
    }
  ],
  "happy": [
    [
      "p1",
      "p2"
    ],
    [
      "p2",
      "p3"
    ],
    [
      "p3",
      "firma"
    ]
  ],
  "branches": [
    [
      "p3",
      "p2"
    ]
  ]
});
  </script>

</html>
