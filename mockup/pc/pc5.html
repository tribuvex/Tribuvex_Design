<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PC5</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/theme.js"></script>
  <script src="../assets/pc.js"></script>
</head>
<body>
<script>
(function () {
  var revisor = new URLSearchParams(location.search).get("revisor") === "1";
  var dual = revisor
    ? '<div class="mb-4 rounded-lg border border-warning/40 bg-warning-subtle p-3 text-sm text-warning-foreground">' +
      "<strong>Doble aprobación por riesgo.</strong> Falta el visto bueno del revisor." +
      '<ul class="mt-2 space-y-1 text-xs">' +
      "<li>✓ Preparador — pendiente de confirmar aquí</li>" +
      "<li>○ Revisor — pendiente (Cola de riesgo)</li>" +
      "</ul></div>"
    : '<p class="mb-3 rounded-md bg-info-subtle px-3 py-2 text-sm text-info-foreground">Expediente de riesgo bajo: basta la aprobación del preparador. ' +
      '<a class="font-semibold underline" href="./pc5.html?revisor=1">Ver variante con revisor</a></p>';

  window.PC_PAGE = {
    badge: "PC5 · Borrador final",
    title: "Aprobación del borrador",
    summary: revisor
      ? "Riesgo alto: el paquete solo se habilita cuando preparador y revisor aprueban."
      : "Revisa el Formulario 210, el saldo y los hallazgos antes de generar el paquete.",
    next: revisor ? "../cola-riesgo.html" : "../paquete.html",
    back: "../expediente.html?etapa=7&pc=5",
    extraFooter:
      '<label class="mr-auto flex items-center gap-2 text-xs"><span class="font-semibold">Devolver a etapa</span>' +
      '<select id="return-stage" class="rounded-lg border border-border bg-card px-2 py-1.5 text-xs">' +
      "<option>E3 Soportes</option><option>E4 Cédulas</option><option>E5 Liquidación</option><option>E6 Patrimonio</option>" +
      "</select></label>",
    bodyHtml:
      dual +
      '<dl class="grid gap-3 text-sm sm:grid-cols-2">' +
      '<div class="rounded-md bg-muted p-3"><dt class="text-xs text-muted-foreground">Saldo a pagar</dt><dd class="font-mono text-lg font-semibold">$ 1.180.000</dd></div>' +
      '<div class="rounded-md bg-muted p-3"><dt class="text-xs text-muted-foreground">Anticipo</dt><dd class="font-mono font-semibold">$ 590.000</dd></div></dl>' +
      '<h3 class="mb-2 mt-4 text-xs font-semibold uppercase text-muted-foreground">Hallazgos del verificador</h3>' +
      '<ul class="list-disc pl-5 text-sm text-muted-foreground"><li>Ningún hallazgo bloqueante en el mockup</li></ul>' +
      '<label class="mt-3 flex items-start gap-2 text-sm"><input type="checkbox" class="mt-1" checked /> <span>Revisé los hallazgos listados.</span></label>' +
      (revisor
        ? '<p class="mt-3 text-xs text-muted-foreground">Al aprobar como preparador, el expediente pasa a la cola del revisor. El paquete sigue bloqueado hasta el segundo OK.</p>'
        : "") +
      '<p class="mt-3 text-xs font-semibold text-destructive">No hay CTA de presentar, firmar ni pagar en MUISCA.</p>',
  };
})();
</script>
<script src="../assets/pc-shell.js"></script>
</body>
</html>
